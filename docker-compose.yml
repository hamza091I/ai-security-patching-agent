services:
  web:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    command: sh -c "python manage.py migrate --noinput && gunicorn core_project.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    command: sh -c "while true; do python manage.py process_scan_jobs --limit 10 --recover-stale --retry-failed; sleep 5; done"
    restart: unless-stopped
    depends_on:
      - web
