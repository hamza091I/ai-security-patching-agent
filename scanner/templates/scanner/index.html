<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Security & Patching Agent - MVP</title>
    <!-- Bootstrap CSS for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5">
        <h2 class="text-center mb-4"> AI Security & Patching Agent</h2>
        
        <div class="row">
            <!-- Input Column -->
            <div class="col-md-6">
                <div class="card shadow p-3 mb-4">
                    <h4>Paste Vulnerable Python Code</h4>
                    <div class="mb-3">
                        <textarea id="code-input" class="form-control font-monospace" rows="10" placeholder="def test():&#10;    eval('1+1')"></textarea>
                    </div>
                    <button id="scan-btn" class="btn btn-primary w-100">Scan & Patch Code</button>
                </div>
            </div>

            <!-- Output Column -->
            <div class="col-md-6">
                <div class="card shadow p-3 mb-4">
                    <h4>Patching Results & Report</h4>
                    <pre id="output-result" class="bg-dark text-light p-3 rounded" style="height: 280px; overflow-y: auto;">Results will appear here...</pre>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript to handle API request -->
<!-- JavaScript to handle API request -->
    <script>
        // Helper function to get the CSRF token from browser cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        document.getElementById('scan-btn').addEventListener('click', async () => {
            const codeText = document.getElementById('code-input').value;
            const outputBox = document.getElementById('output-result');
            
            outputBox.innerText = "Scanning and patching in progress...";

            // Retrieve the CSRF token for secure POST requests
            const csrftoken = getCookie('csrftoken');

            try {
                let response = await fetch('/api/scan-code/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken, // Pass the CSRF token in headers
                    },
                    body: JSON.stringify({ code: codeText })
                });

                // Check if response is valid JSON
                const contentType = response.headers.get("content-type");
                if (contentType && contentType.includes("application/json")) {
                    let data = await response.json();
                    outputBox.innerText = JSON.stringify(data, null, 4);
                } else {
                    let errorText = await response.text();
                    outputBox.innerText = "Server Error (Non-JSON Response):\n" + errorText;
                }
            } catch (error) {
                outputBox.innerText = "Network Error: " + error;
            }
        });
    </script>
</body>
</html>
